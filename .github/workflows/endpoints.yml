name: Check live data sources

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe WebSockets and REST/CORS from a US runner
        run: node tools/check_endpoints.mjs | tee -a "$GITHUB_STEP_SUMMARY"
