name: Research (real-data backtest + feed agreement)
on:
  workflow_dispatch:
    inputs:
      days: { description: 'Days of history', default: '30' }
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/real_backtest.mjs ${{ inputs.days }} | tee -a "$GITHUB_STEP_SUMMARY"
  dispersion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/dispersion.mjs | tee -a "$GITHUB_STEP_SUMMARY"
